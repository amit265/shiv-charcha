name: 🌟 Build & Submit to Production Track

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Create Google Service Account JSON
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      - name: Prebuild Android
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo prebuild --clean --platform android

      - name: Build Android AAB Locally (Production)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: "-Xmx10g -XX:MaxMetaspaceSize=4g -XX:+UseG1GC"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: eas build --platform android --profile production --local --non-interactive

      - name: Submit AAB to Play Store Production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          AAB_PATH=$(find . -maxdepth 1 -name "*.aab" | head -n 1)
          echo "Found AAB at: $AAB_PATH"
          eas submit --platform android --profile production --path "$AAB_PATH" --non-interactive
