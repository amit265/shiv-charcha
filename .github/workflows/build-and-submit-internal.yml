name: 🚀 Build & Submit to Internal Testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Create Google Service Account JSON
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      - name: Build and Submit Android AAB to Internal Testing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: "-Xmx10g -XX:MaxMetaspaceSize=4g -XX:+UseG1GC"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: eas build --platform android --profile internal --non-interactive --auto-submit
